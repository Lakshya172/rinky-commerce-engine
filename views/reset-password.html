<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password – Rinky Jewellers</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="apple-touch-icon" href="/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="nav-placeholder"></div>

<div class="auth-page">
  <div class="auth-card">
    <img src="/images/logo-icon.svg" style="width:58px;height:58px;margin:0 auto 12px;display:block;filter:drop-shadow(0 2px 8px rgba(200,169,110,0.5))" alt="Logo" />
    <h2>New Password</h2>
    <span class="eyebrow">Rinky Jewellers</span>
    <p style="text-align:center; font-size:14px; color:var(--text-muted); margin: 10px 0 20px;">
      Please enter your new password below.
    </p>

    <form class="auth-form active" id="resetForm" novalidate>
      <div class="form-alert form-alert-error" id="resetAlert"><i class="fas fa-exclamation-circle"></i><span></span></div>
      <div class="form-alert form-alert-success" id="resetSuccess"><i class="fas fa-check-circle"></i><span></span></div>

      <div class="form-group">
        <label class="form-label" for="resetPwd">New Password</label>
        <div class="password-wrap">
          <input class="form-input" id="resetPwd" type="password" placeholder="At least 6 characters" required />
          <i class="fas fa-eye toggle-pwd"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="resetPwd2">Confirm Password</label>
        <div class="password-wrap">
          <input class="form-input" id="resetPwd2" type="password" placeholder="Repeat password" required />
          <i class="fas fa-eye toggle-pwd"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-gold btn-full" id="resetBtn">
        <span>Save New Password</span>
      </button>
    </form>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/navbar.js"></script>
<script src="/js/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('resetForm');
  const btn = document.getElementById('resetBtn');
  const alert = document.getElementById('resetAlert');
  const success = document.getElementById('resetSuccess');

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  if (!token) {
    alert.classList.add('show');
    alert.querySelector('span').textContent = 'Invalid or missing reset token.';
    btn.disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('resetPwd').value;
    const pwd2 = document.getElementById('resetPwd2').value;

    alert.classList.remove('show');
    success.classList.remove('show');

    if (!pwd || pwd.length < 6) {
      alert.classList.add('show');
      alert.querySelector('span').textContent = 'Password must be at least 6 characters.';
      return;
    }

    if (pwd !== pwd2) {
      alert.classList.add('show');
      alert.querySelector('span').textContent = 'Passwords do not match.';
      return;
    }

    btn.disabled = true;
    btn.querySelector('span').textContent = 'Saving...';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: pwd })
      });
      const data = await res.json();
      
      if (data.success) {
        success.classList.add('show');
        success.querySelector('span').textContent = data.message;
        form.reset();
        setTimeout(() => {
          window.location.href = '/login';
        }, 3000);
      } else {
        alert.classList.add('show');
        alert.querySelector('span').textContent = data.message;
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Save New Password';
      }
    } catch (err) {
      alert.classList.add('show');
      alert.querySelector('span').textContent = 'Server error. Please try again.';
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Save New Password';
    }
  });
});
</script>
</body>
</html>
