<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist – Rinky Jewellers</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon-mark.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="nav-placeholder"></div>

<section class="wishlist-section">
  <div class="container">
    <div style="margin-bottom:40px">
      <p class="eyebrow">Your Saved Pieces</p>
      <h1 style="font-family:var(--ff-display);font-size:clamp(40px,6vw,72px);font-weight:400">My Wishlist</h1>
      <span class="ornament">✦ ✦ ✦</span>
    </div>
    <div class="products-grid" id="wishGrid">
      <div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-body"><div class="skel-line skeleton w40"></div><div class="skel-line skeleton w80" style="height:18px;margin-top:8px"></div><div class="skel-line skeleton w60"></div><div class="skel-line skeleton w80" style="height:36px;border-radius:6px;margin-top:14px"></div></div></div>
      <div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-body"><div class="skel-line skeleton w40"></div><div class="skel-line skeleton w80" style="height:18px;margin-top:8px"></div><div class="skel-line skeleton w60"></div><div class="skel-line skeleton w80" style="height:36px;border-radius:6px;margin-top:14px"></div></div></div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="/js/navbar.js"></script>
<script src="/js/shared.js"></script>
<script>
(async () => {
  const state = await getAuthState();
  const grid  = document.getElementById('wishGrid');

  if (!state.loggedIn) {
    grid.innerHTML = `
      <div style="grid-column:1/-1" class="empty-state">
        <i class="far fa-heart"></i>
        <h3>Please log in to see your wishlist</h3>
        <p>Save your favourite pieces and find them here anytime.</p>
        <a href="/login" class="btn btn-gold" style="margin-top:20px">Login to Account</a>
      </div>`;
    return;
  }

  try {
    const res  = await fetch('/api/wishlist');
    const data = await res.json();
    const list = data.wishlist || [];

    if (list.length === 0) {
      grid.innerHTML = `
        <div style="grid-column:1/-1" class="empty-state">
          <i class="far fa-heart"></i>
          <h3>Your wishlist is empty</h3>
          <p>Browse our collection and save pieces you love.</p>
          <a href="/products" class="btn btn-gold" style="margin-top:20px">Explore Collection</a>
        </div>`;
      return;
    }

    const wishIds = list.map(p => p._id || p);
    grid.innerHTML = list.map(p => buildProductCard(p, wishIds)).join('');
    initScrollReveal();
  } catch {
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)">Failed to load wishlist.</p>`;
  }
})();
</script>
</body>
</html>
