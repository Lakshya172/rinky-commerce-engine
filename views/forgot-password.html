<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Rinky Jewellers</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="nav-placeholder"></div>

<div class="auth-page">
  <div class="auth-card">
    <img src="/images/logo-icon.svg" style="width:58px;height:58px;margin:0 auto 12px;display:block;filter:drop-shadow(0 2px 8px rgba(200,169,110,0.5))" alt="Logo" />
    <h2>Reset Password</h2>
    <span class="eyebrow">Rinky Jewellers</span>
    <p style="text-align:center; font-size:14px; color:var(--text-muted); margin: 10px 0 20px;">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <form class="auth-form active" id="forgotForm" novalidate>
      <div class="form-alert form-alert-error" id="forgotAlert"><i class="fas fa-exclamation-circle"></i><span></span></div>
      <div class="form-alert form-alert-success" id="forgotSuccess"><i class="fas fa-check-circle"></i><span></span></div>

      <div class="form-group">
        <label class="form-label" for="forgotEmail">Email Address</label>
        <input class="form-input" id="forgotEmail" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <button type="submit" class="btn btn-gold btn-full" id="forgotBtn">
        <span>Send Reset Link</span>
      </button>

      <p class="auth-switch">Remember your password? <a href="/login">Login</a></p>
    </form>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="/js/navbar.js"></script>
<script src="/js/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('forgotForm');
  const btn = document.getElementById('forgotBtn');
  const alert = document.getElementById('forgotAlert');
  const success = document.getElementById('forgotSuccess');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();

    alert.classList.remove('show');
    success.classList.remove('show');

    if (!email) {
      alert.classList.add('show');
      alert.querySelector('span').textContent = 'Please enter your email.';
      return;
    }

    btn.disabled = true;
    btn.querySelector('span').textContent = 'Sending...';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      
      if (data.success) {
        success.classList.add('show');
        success.querySelector('span').textContent = data.message;
        form.reset();
      } else {
        alert.classList.add('show');
        alert.querySelector('span').textContent = data.message;
      }
    } catch (err) {
      alert.classList.add('show');
      alert.querySelector('span').textContent = 'Server error. Please try again.';
    }

    btn.disabled = false;
    btn.querySelector('span').textContent = 'Send Reset Link';
  });
});
</script>
</body>
</html>
