    <circle cx="0" cy="0" r="112" fill="none" stroke="url(#favGold)" stroke-width="4.5"/>
    <circle cx="0" cy="0" r="100" fill="#0C0A07" stroke="url(#favGoldLight)" stroke-width="2"/>
    
    <!-- Laurel Leaves -->
    <g fill="url(#favGoldLight)" stroke="url(#favGold)" stroke-width="0.8">
      <!-- Left Leaves -->
      <path d="M-15,106 C-26,108 -38,101 -38,101 C-38,101 -32,88 -22,92 Z"/>
      <path d="M-33,105 C-46,102 -53,90 -53,90 C-53,90 -42,84 -33,91 Z"/>
      <path d="M-51,92 C-64,86 -68,72 -68,72 C-68,72 -55,68 -46,79 Z"/>
      <path d="M-64,77 C-77,67 -79,53 -79,53 C-79,53 -66,52 -57,64 Z"/>
      <path d="M-75,57 C-88,44 -88,29 -88,29 C-88,29 -75,31 -68,44 Z"/>
      <path d="M-84,35 C-96,20 -92,4 -92,4 C-92,4 -80,9 -76,23 Z"/>
      <path d="M-88,11 C-99,-7 -92,-22 -92,-22 C-92,-22 -80,-15 -79,-1 Z"/>
      <path d="M-88,-13 C-97,-31 -88,-46 -88,-46 C-88,-46 -77,-37 -79,-23 Z"/>
      <path d="M-83,-35 C-89,-53 -78,-66 -78,-66 C-78,-66 -68,-56 -73,-43 Z"/>
      <path d="M-72,-55 C-77,-73 -64,-84 -64,-84 C-64,-84 -55,-75 -62,-62 Z"/>

      <!-- Right Leaves -->
      <path d="M15,106 C26,108 38,101 38,101 C38,101 32,88 22,92 Z"/>
      <path d="M33,105 C46,102 53,90 53,90 C53,90 42,84 33,91 Z"/>
      <path d="M51,92 C64,86 68,72 68,72 C68,72 55,68 46,79 Z"/>
      <path d="M64,77 C77,67 79,53 79,53 C79,53 66,52 57,64 Z"/>
      <path d="M75,57 C88,44 88,29 88,29 C88,29 75,31 68,44 Z"/>
      <path d="M84,35 C96,20 92,4 92,4 C92,4 80,9 76,23 Z"/>
      <path d="M88,11 C99,-7 92,-22 92,-22 C92,-22 80,-15 79,-1 Z"/>
      <path d="M88,-13 C97,-31 88,-46 88,-46 C88,-46 77,-37 79,-23 Z"/>
      <path d="M83,-35 C89,-53 78,-66 78,-66 C78,-66 68,-56 73,-43 Z"/>
      <path d="M72,-55 C77,-73 64,-84 64,-84 C64,-84 55,-75 62,-62 Z"/>
    </g>

    <!-- ══════════ "RJ" MONOGRAM TEXT ══════════ -->
    <text x="0" y="36" font-family="'Playfair Display', 'Cinzel', serif" font-size="108" font-weight="700" fill="url(#favGoldLight)" text-anchor="middle" letter-spacing="4">RJ</text>
  </g>
</svg>
